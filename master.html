<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет мастера</title>
    <style>
        :root {
            --primary: #ff69b4;
            --primary-light: #fff0f5;
            --bg: #fff5f8;
            --text: #333;
            --gray: #666;
            --border: #ffd1dc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.15);
        }
        h1, h2 { color: var(--primary); text-align: center; }
        .logo { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; color: var(--primary); }
        .card {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 16px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .badge-free { background: #e6f4ea; color: #137333; padding: 3px 6px; border-radius: 6px; font-size: 12px; }
        .badge-busy { background: #fce8e6; color: #c5221f; padding: 3px 6px; border-radius: 6px; font-size: 12px; }
        .badge-closed { background: #f1f3f4; color: #5f6368; padding: 3px 6px; border-radius: 6px; font-size: 12px; }
        .action-btn {
            padding: 5px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-open { background: #e6f4ea; color: #137333; }
        .btn-close { background: #fce8e6; color: #c5221f; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Кабинет мастера</div>

    <!-- Авторизация -->
    <div id="login-box" class="card">
        <h2>Вход</h2>
        <label>Введите PIN-код (по умолчанию: 1234):</label>
        <input type="password" id="pin-input" placeholder="PIN">
        <button class="btn" onclick="checkPin()">Войти</button>
    </div>

    <!-- Основная панель -->
    <div id="master-panel" class="hidden">
        
        <!-- Управление услугами -->
        <div class="card">
            <h3>Услуги</h3>
            <div id="master-services-list"></div>
            <h4 style="margin:10px 0 5px 0; font-size:14px;">Добавить услугу:</h4>
            <input type="text" id="new-s-name" placeholder="Название услуги">
            <input type="text" id="new-s-duration" placeholder="Длительность (например: 1 час)">
            <input type="text" id="new-s-badge" placeholder="Стикер (например: Хит 🔥)">
            <button class="btn" onclick="addService()">Добавить услугу</button>
        </div>

        <!-- Управление расписанием -->
        <div class="card">
            <h3>Управление расписанием</h3>
            <label>Дата:</label>
            <input type="date" id="master-date" onchange="renderMasterSchedule()">
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-open" style="padding:10px;" onclick="setDayStatus('open')">Открыть весь день</button>
                <button class="btn btn-close" style="padding:10px;" onclick="setDayStatus('closed')">Закрыть весь день</button>
            </div>

            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Время</th>
                        <th>Статус / Запись</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody id="schedule-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function checkPin() {
        let pin = document.getElementById('pin-input').value;
        if (pin === '1234') {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('master-panel').classList.remove('hidden');
            
            let today = new Date().toISOString().split('T')[0];
            document.getElementById('master-date').value = today;
            renderMasterServices();
            renderMasterSchedule();
        } else {
            alert('Неверный PIN-код!');
        }
    }

    let defaultServices = [
        { id: 1, name: "Маникюр классический", duration: "1 час", badge: "Хит 🔥" },
        { id: 2, name: "Маникюр + Покрытие", duration: "1.5 часа", badge: "Топ ✨" },
        { id: 3, name: "Наращивание ногтей", duration: "2.5 часа", badge: "Премиум 👑" }
    ];

    function renderMasterServices() {
        let services = JSON.parse(localStorage.getItem('salon_services')) || defaultServices;
        let list = document.getElementById('master-services-list');
        list.innerHTML = '';
        services.forEach((s, index) => {
            let div = document.createElement('div');
            div.style.display = "flex";
            div.style.justifyContent = "space-between";
            div.style.alignItems = "center";
            div.style.marginBottom = "8px";
            div.style.borderBottom = "1px solid #eee";
            div.style.paddingBottom = "5px";
            div.innerHTML = `
                <span><b>${s.name}</b> (${s.duration}) [${s.badge || ''}]</span>
                <button class="action-btn btn-close" onclick="deleteService(${index})">Удалить</button>
            `;
            list.appendChild(div);
        });
    }

    function addService() {
        let name = document.getElementById('new-s-name').value;
        let duration = document.getElementById('new-s-duration').value;
        let badge = document.getElementById('new-s-badge').value;

        if (!name) {
            alert('Заполните название услуги');
            return;
        }

        let services = JSON.parse(localStorage.getItem('salon_services')) || defaultServices;
        services.push({ id: Date.now(), name, duration, badge });
        localStorage.setItem('salon_services', JSON.stringify(services));

        document.getElementById('new-s-name').value = '';
        document.getElementById('new-s-duration').value = '';
        document.getElementById('new-s-badge').value = '';
        renderMasterServices();
    }

    function deleteService(index) {
        let services = JSON.parse(localStorage.getItem('salon_services')) || defaultServices;
        services.splice(index, 1);
        localStorage.setItem('salon_services', JSON.stringify(services));
        renderMasterServices();
    }

    function renderMasterSchedule() {
        let date = document.getElementById('master-date').value;
        let tbody = document.getElementById('schedule-tbody');
        tbody.innerHTML = '';

        let schedule = JSON.parse(localStorage.getItem('salon_schedule')) || {};
        let daySlots = schedule[date] || {
            "08:00": "closed", "09:00": "closed", "10:00": "closed", 
            "11:00": "closed", "12:00": "closed", "13:00": "closed", 
            "14:00": "closed", "15:00": "closed", "16:00": "closed", 
            "17:00": "closed", "18:00": "closed"
        };

        Object.keys(daySlots).forEach(time => {
            let status = daySlots[time];
            let badgeHtml = '';
            let actionBtn = '';

            if (status === 'open') {
                badgeHtml = '<span class="badge-free">Свободно</span>';
                actionBtn = `<button class="action-btn btn-close" onclick="changeSlotTime('${date}', '${time}', 'closed')">Закрыть</button>`;
            } else if (status === 'closed') {
                badgeHtml = '<span class="badge-closed">Закрыто</span>';
                actionBtn = `<button class="action-btn btn-open" onclick="changeSlotTime('${date}', '${time}', 'open')">Открыть</button>`;
            } else {
                badgeHtml = `<span class="badge-busy">${status}</span>`;
                actionBtn = `<button class="action-btn btn-close" onclick="changeSlotTime('${date}', '${time}', 'open')">Снять запись</button>`;
            }

            let tr = document.createElement('tr');
            tr.innerHTML = `<td><b>${time}</b></td><td>${badgeHtml}</td><td>${actionBtn}</td>`;
            tbody.appendChild(tr);
        });
    }

    function changeSlotTime(date, time, newStatus) {
        let schedule = JSON.parse(localStorage.getItem('salon_schedule')) || {};
        if (!schedule[date]) {
            schedule[date] = {
                "08:00": "closed", "09:00": "closed", "10:00": "closed", 
                "11:00": "closed", "12:00": "closed", "13:00": "closed", 
                "14:00": "closed", "15:00": "closed", "16:00": "closed", 
                "17:00": "closed", "18:00": "closed"
            };
        }
        schedule[date][time] = newStatus;
        localStorage.setItem('salon_schedule', JSON.stringify(schedule));
        renderMasterSchedule();
    }

    function setDayStatus(status) {
        let date = document.getElementById('master-date').value;
        let schedule = JSON.parse(localStorage.getItem('salon_schedule')) || {};
        let daySlots = schedule[date] || {
            "08:00": "closed", "09:00": "closed", "10:00": "closed", 
            "11:00": "closed", "12:00": "closed", "13:00": "closed", 
            "14:00": "closed", "15:00": "closed", "16:00": "closed", 
            "17:00": "closed", "18:00": "closed"
        };

        Object.keys(daySlots).forEach(time => {
            if (daySlots[time] === 'open' || daySlots[time] === 'closed') {
                daySlots[time] = status;
            }
        });

        schedule[date] = daySlots;
        localStorage.setItem('salon_schedule', JSON.stringify(schedule));
        renderMasterSchedule();
    }
</script>
</body>
</html>
