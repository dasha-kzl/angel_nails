<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на услуги</title>
    <style>
        :root {
            --primary: #ff69b4;
            --primary-light: #fff0f5;
            --bg: #fff5f8;
            --text: #333;
            --gray: #666;
            --border: #ffd1dc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #fff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.15);
        }
        h1, h2 { color: var(--primary); text-align: center; }
        .logo { font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 20px; color: var(--primary); }
        .service-card {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .service-card.selected {
            border-color: var(--primary);
            background-color: var(--primary-light);
        }
        .service-info h3 { margin: 0 0 5px 0; font-size: 16px; }
        .service-info p { margin: 0; color: var(--gray); font-size: 14px; }
        .badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        .time-slot {
            padding: 10px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .time-slot.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .time-slot.booked {
            background: #f0f0f0;
            color: #ccc;
            border-color: #ddd;
            cursor: not-allowed;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 16px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button.btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Beauty Booking</div>
    
    <h2>Онлайн-запись</h2>
    
    <!-- Выбор услуги -->
    <div class="section-title">1. Выберите услугу:</div>
    <div id="services-list"></div>

    <!-- Выбор даты -->
    <div class="section-title">2. Выберите дату:</div>
    <input type="date" id="booking-date" onchange="loadSlots()">

    <!-- Выбор времени -->
    <div class="section-title">3. Выберите время:</div>
    <div class="time-slots" id="slots-container"></div>

    <!-- Данные клиента -->
    <div class="section-title">4. Ваши данные:</div>
    <label>Имя:</label>
    <input type="text" id="client-name" placeholder="Введите ваше имя">
    
    <label>Телефон:</label>
    <input type="tel" id="client-phone" placeholder="+7 (...) ...-..-..">

    <button class="btn" onclick="submitBooking()">Записаться</button>
</div>

<script>
    let defaultServices = [
        { id: 1, name: "Маникюр классический", duration: "1 час", badge: "Хит 🔥" },
        { id: 2, name: "Маникюр + Покрытие", duration: "1.5 часа", badge: "Топ ✨" },
        { id: 3, name: "Наращивание ногтей", duration: "2.5 часа", badge: "Премиум 👑" }
    ];

    let selectedService = null;
    let selectedTime = null;

    function renderServices() {
        let services = JSON.parse(localStorage.getItem('salon_services')) || defaultServices;
        const list = document.getElementById('services-list');
        list.innerHTML = '';
        
        services.forEach(s => {
            let card = document.createElement('div');
            card.className = `service-card ${selectedService?.id === s.id ? 'selected' : ''}`;
            card.innerHTML = `
                <div class="service-info">
                    <h3>${s.name}</h3>
                    <p>⏱ ${s.duration}</p>
                </div>
                <div class="badge">${s.badge || 'Услуга'}</div>
            `;
            card.onclick = () => {
                selectedService = s;
                renderServices();
            };
            list.appendChild(card);
        });
    }

    function loadSlots() {
        let selectedDate = document.getElementById('booking-date').value;
        const container = document.getElementById('slots-container');
        container.innerHTML = '';
        
        let schedule = JSON.parse(localStorage.getItem('salon_schedule')) || {};
        let daySlots = schedule[selectedDate] || {
            "09:00": "open", "10:00": "open", "11:00": "open", 
            "12:00": "open", "13:00": "open", "14:00": "open", 
            "15:00": "open", "16:00": "open", "17:00": "open"
        };

        Object.keys(daySlots).forEach(time => {
            let status = daySlots[time];
            let isBooked = (status !== 'open');

            let slot = document.createElement('div');
            slot.className = `time-slot ${isBooked ? 'booked' : ''} ${selectedTime === time ? 'selected' : ''}`;
            slot.innerText = time;

            if (!isBooked) {
                slot.onclick = () => {
                    selectedTime = time;
                    loadSlots();
                };
            }
            container.appendChild(slot);
        });
    }

    function submitBooking() {
        let name = document.getElementById('client-name').value;
        let phone = document.getElementById('client-phone').value;
        let selectedDate = document.getElementById('booking-date').value;

        if (!selectedService) {
            alert('Пожалуйста, выберите услугу');
            return;
        }
        if (!selectedTime) {
            alert('Пожалуйста, выберите время');
            return;
        }
        if (!name || !phone) {
            alert('Пожалуйста, заполните имя и телефон');
            return;
        }

        let schedule = JSON.parse(localStorage.getItem('salon_schedule')) || {};
        if (!schedule[selectedDate]) schedule[selectedDate] = {};
        
        schedule[selectedDate][selectedTime] = `${name} (${phone}) - ${selectedService.name}`;
        localStorage.setItem('salon_schedule', JSON.stringify(schedule));

        alert('Вы успешно записаны!');
        location.reload();
    }

    let today = new Date().toISOString().split('T')[0];
    document.getElementById('booking-date').value = today;
    renderServices();
    loadSlots();
</script>
</body>
</html>
